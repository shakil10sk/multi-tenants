version: '3.9'

services:

  # Laravel backend
  backend:
    build: ./backend
    container_name: multi_tenant
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  # React frontend
  frontend:
    build: ./frontend
    container_name: multi_tenant_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"

  # Nginx reverse proxy
  webserver:
    image: nginx:stable-alpine
    container_name: tenant_nginx_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/build:/var/www/html/frontend:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  # PostgreSQL database
  db:
    image: mysql:8.1
    container_name: mysql_db
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  # Redis for caching & queues
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Laravel Queue Worker
  queue:
    build: ./backend
    container_name: laravel_queue
    command: php artisan queue:work --sleep=3 --tries=3 --queue=default,emails
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - redis

  # Mailhog for local email testing
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"

volumes:
  dbdata:
